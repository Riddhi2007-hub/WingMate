# Fly.io: `fly launch --no-deploy` (keep this file), `fly volumes create wingmate_data --size 1`, set secrets, `fly deploy`.
app = "wingmate"
primary_region = "sin"

[build]

[env]
  PORT = "3000"

[mounts]
  source = "wingmate_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
